[colors]
background = #B32A0B12
foreground = #FFF0E9
red = #FF786B
burgundy = #69252D
orange = #E69B86
yellow = #FFD0A0

[bar/proxima]
width = 98%
height = 30
offset-x = 1%
offset-y = 8
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 1
border-color = ${colors.burgundy}
radius = 6
line-size = 2
line-color = ${colors.red}
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = JetBrainsMono Nerd Font:size=9;2
modules-left = power wifi bluetooth microphone vpn
modules-center = clock
modules-right = volume battery
enable-ipc = true
wm-restack = generic
override-redirect = false

[module/power]
type = custom/text
content = "[ 󰐥 ]"
content-foreground = ${colors.red}
click-left = ~/.config/polybar/scripts/power-menu.sh
tooltip = Power menu

[module/workspace1]
type = custom/text
content = "[ 1 ]"
content-foreground = ${colors.orange}
click-left = wmctrl -s 0
tooltip = Workspace 1

[module/workspace2]
type = custom/text
content = "[ 2 ]"
content-foreground = ${colors.orange}
click-left = wmctrl -s 1
tooltip = Workspace 2

[module/workspace3]
type = custom/text
content = "[ 3 ]"
content-foreground = ${colors.orange}
click-left = wmctrl -s 2
tooltip = Workspace 3

[module/workspace4]
type = custom/text
content = "[ 4 ]"
content-foreground = ${colors.orange}
click-left = wmctrl -s 3
tooltip = Workspace 4

[module/wifi]
type = custom/text
content = "[ 󰤨 ]"
content-foreground = ${colors.orange}
click-left = nm-connection-editor
tooltip = Wi-Fi settings

[module/bluetooth]
type = custom/text
content = "[ 󰂯 ]"
content-foreground = ${colors.orange}
click-left = bash -lc 'if command -v blueman-manager >/dev/null; then blueman-manager; else notify-send "Bluetooth" "Install blueman to open its manager"; fi'
tooltip = Bluetooth settings

[module/microphone]
type = custom/text
content = "[ 󰍬 ]"
content-foreground = ${colors.orange}
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
click-right = pavucontrol
tooltip = Left-click to mute microphone; right-click for audio settings

[module/vpn]
type = custom/script
exec = bash -c 'if tailscale status --json 2>/dev/null | grep -q "\"BackendState\": \"Running\""; then echo "%{F#E69B86}[ 󰦝 Tailscale ]%{F-}"; else echo "%{F#FF786B}[ 󰦝 Offline ]%{F-}"; fi'
interval = 5
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/vpn-menu.sh
tooltip = Tailscale menu

[module/clock]
type = internal/date
interval = 1
time = %H:%M:%S
date = %A, %d %B
label = [ %time% ]  %date%
label-foreground = ${colors.yellow}
click-left = cinnamon-calendar

[module/volume]
type = internal/pulseaudio
format-volume = [ <ramp-volume> <label-volume> ]
format-muted = [ <label-muted> ]
label-volume = %percentage%%
label-volume-foreground = ${colors.orange}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.red}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
format-charging = [ <label-charging> ]
format-discharging = [ <label-discharging> ]
format-full = [ <label-full> ]
label-charging = 󰂄 %percentage%%
label-discharging = 󰁹 %percentage%%
label-full = 󰁹 %percentage%%
label-charging-foreground = ${colors.yellow}
label-discharging-foreground = ${colors.orange}
label-full-foreground = ${colors.red}
